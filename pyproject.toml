[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-router-local"
version = "0.1.0"
description = "Router local cheap/strong/abstain para ahorrar tokens"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Angel Salazar" }]
dependencies = ["pytest>=8.0.0", "rich>=13.7.0"]

[project.scripts]
model-router = "model_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
